<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel de la campaña</title>
<!--
  PLANTILLA DEL PANEL. No se edita este archivo: los datos van en datos.js.
  La carpeta completa (index.html, datos.js, logo-ucab.svg) es la que se sube a Netlify Drop.
-->
<style>
:root{
  --verde:#047732;--verde-2:#0a5c2a;--verde-suave:#e3f1e8;
  --azul:#1b7fb0;--azul-claro:#40b4e5;--azul-suave:#e2f3fb;
  --amarillo:#ffc526;--amarillo-suave:#fff4d1;
  --rojo:#b3261e;--rojo-suave:#fbe3e1;
  --tinta:#12100c;--gris:#5b5f63;--gris-claro:#9aa0a6;--linea:#e2e4e6;
  --fondo:#f3f5f4;--papel:#fff;
  --serie:#047732,#40b4e5,#ffc526,#1b7fb0,#7a9c3b,#9aa0a6;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--fondo);color:var(--tinta);font:15px/1.45 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.barra{background:var(--papel);border-bottom:4px solid var(--verde);display:flex;align-items:center;gap:18px;padding:12px 24px;flex-wrap:wrap}
.barra img{height:34px;width:auto}
.barra .tit{flex:1;min-width:220px}
.barra h1{margin:0;font-size:20px;line-height:1.2}
.barra p{margin:2px 0 0;color:var(--gris);font-size:13px}
.barra .acc{display:flex;gap:8px}
.btn{border:1px solid var(--verde);background:var(--verde);color:#fff;font:600 13px/1 inherit;font-family:inherit;padding:9px 14px;border-radius:6px;cursor:pointer;text-decoration:none}
.btn.sec{background:#fff;color:var(--verde)}
main{max-width:1240px;margin:auto;padding:20px 24px 48px;display:grid;gap:18px}
.ficticio{background:var(--amarillo);color:var(--tinta);font-weight:700;text-align:center;padding:9px 14px;border-radius:6px;letter-spacing:.02em}
.resumen{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.caja{background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:16px 18px;min-width:0;break-inside:avoid}
.caja h2{margin:0 0 4px;font-size:15px;line-height:1.25}
.caja .sub{margin:0;color:var(--gris);font-size:12.5px}
.meta-grande{font-size:18px;font-weight:700;line-height:1.3;margin:6px 0 0}
.etq{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 7px;border-radius:4px;vertical-align:middle}
.etq.conducta{background:var(--verde-suave);color:var(--verde-2)}
.etq.paso{background:var(--azul-suave);color:#0f5d82}
.etq.vanidad{background:#eceeef;color:var(--gris)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kpi .num{font-size:40px;font-weight:700;line-height:1.05;margin:10px 0 2px;letter-spacing:-.01em}
.kpi .uni{color:var(--gris);font-size:13px}
.kpi .delta{font-size:13px;font-weight:600;margin-top:8px}
.sube{color:var(--verde)}.baja{color:var(--rojo)}.igual{color:var(--gris)}
.prog{height:8px;background:#eceeef;border-radius:4px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--verde);border-radius:4px}
.prog.bajo i{background:var(--amarillo)}
.graficos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.graficos .ancho{grid-column:1/-1}
.cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:inherit;fill:var(--gris);font-size:12px}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 0;font-size:12.5px;color:var(--gris)}
.leyenda span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--c);vertical-align:-1px}
.decision{margin:12px 0 0;padding:9px 11px;background:var(--amarillo-suave);border-left:4px solid var(--amarillo);border-radius:4px;font-size:13.5px}
.decision b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#7a5a00;margin-bottom:2px}
.fuente{margin:8px 0 0;color:var(--gris-claro);font-size:11.5px}
.nota{margin:8px 0 0;color:var(--gris);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:7px 8px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:top}
th{background:var(--verde-suave);color:var(--verde-2);font-weight:700}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.lecturas ul{margin:6px 0 0;padding-left:18px;display:grid;gap:6px}
footer{color:var(--gris);font-size:12px;border-top:1px solid var(--linea);padding-top:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media screen and (max-width:820px){.resumen,.graficos{grid-template-columns:minmax(0,1fr)}main{padding:16px}.barra{padding:12px 16px}}
@media print{
  @page{size:A4 landscape;margin:10mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:12.5px}
  .barra .acc{display:none}
  main{max-width:none;padding:10px 0 0;gap:12px}
  .barra{padding:6px 0 10px}
  .caja{border-color:#d5d8da;padding:12px 14px}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .kpi .num{font-size:30px}
  .resumen{grid-template-columns:2fr 1fr;gap:12px}
  .graficos{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .graficos svg{max-height:62mm}
}
</style>
</head>
<body>
<header class="barra">
  <img src="logo-ucab.svg" alt="UCAB">
  <div class="tit"><h1 id="titulo">Panel de la campaña</h1><p id="bajada"></p></div>
  <div class="acc"><a class="btn sec" id="btn-pdf" hidden download>Descargar PDF</a><button class="btn" id="btn-imp" type="button">Guardar en PDF</button></div>
</header>
<main id="app"></main>
<script src="datos.js"></script>
<script>
(function(){
  var D = window.PANEL;
  var app = document.getElementById('app');
  if(!D){app.innerHTML='<div class="caja">Falta el archivo <b>datos.js</b> junto a esta página.</div>';return;}
  var SERIE = ['#047732','#40b4e5','#ffc526','#1b7fb0','#7a9c3b','#9aa0a6'];
  var esc = function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var fmt = function(n,dec){if(n==null||n==='')return '–';var d=dec!=null?dec:(Math.abs(n)<10&&n%1?1:0);return Number(n).toLocaleString('es-VE',{minimumFractionDigits:d,maximumFractionDigits:d})};
  var CAPA = {conducta:['conducta','Conducta'],'primer paso':['paso','Primer paso'],paso:['paso','Primer paso'],interes:['paso','Interés'],'interés':['paso','Interés'],vanidad:['vanidad','Vanidad']};
  var etq = function(c){var k=CAPA[(c||'').toLowerCase()];return k?'<span class="etq '+k[0]+'">'+k[1]+'</span>':''};
  var pie = function(c){
    return (c.nota?'<p class="nota">'+esc(c.nota)+'</p>':'')
      + (c.decision?'<div class="decision"><b>Qué decidir</b>'+esc(c.decision)+'</div>':'')
      + (c.fuente?'<p class="fuente">Fuente: '+esc(c.fuente)+'</p>':'');
  };
  var cab = function(c){return '<div class="cab"><div><h2>'+esc(c.titulo)+'</h2>'+(c.subtitulo?'<p class="sub">'+esc(c.subtitulo)+'</p>':'')+'</div>'+etq(c.capa)+'</div>'};
  /* Máximo del eje en cuatro marcas redondas (0, 20, 40, 60, 80). */
  var niceMax = function(v){if(v<=0)return 4;var raw=v/4,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p,st=(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;return Math.ceil(v/st)*st};

  function kpi(c){
    var pct = c.meta?Math.min(100,Math.round(c.valor/c.meta*100)):null;
    var d = (c.anterior!=null&&c.valor!=null)?c.valor-c.anterior:null;
    var cls = d==null?'':d>0?'sube':d<0?'baja':'igual';
    var flecha = d==null?'':d>0?'▲ ':d<0?'▼ ':'= ';
    return '<div class="caja kpi">'+cab(c)
      +'<div class="num">'+fmt(c.valor)+(c.de!=null?'<span style="font-size:20px;color:var(--gris)"> de '+fmt(c.de)+'</span>':'')+'</div>'
      +'<div class="uni">'+esc(c.unidad||'')+'</div>'
      +(pct!=null?'<div class="prog'+(pct<100?' bajo':'')+'"><i style="width:'+pct+'%"></i></div><div class="uni" style="margin-top:4px">'+pct+' % de la meta ('+fmt(c.meta)+')</div>':'')
      +(d!=null?'<div class="delta '+cls+'">'+flecha+(d>0?'+':'')+fmt(d)+' frente a '+esc(c.anterior_texto||'la semana anterior')+'</div>':'')
      +pie(c)+'</div>';
  }

  function linea(c){
    var W=560,H=230,L=40,R=64,T=16,B=34,x=c.ejeX||[],ss=c.series||[];
    var all=[];ss.forEach(function(s){s.valores.forEach(function(v){if(v!=null)all.push(v)})});if(c.meta!=null)all.push(c.meta);
    var max=niceMax(Math.max.apply(null,all.concat([1]))*1.08),n=x.length,iw=W-L-R,ih=H-T-B;
    var px=function(i){return L+18+(n<2?(iw-36)/2:i*(iw-36)/(n-1))},py=function(v){return T+ih-(v/max)*ih};
    var g='';for(var k=0;k<=4;k++){var v=max*k/4,y=py(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#e2e4e6"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+fmt(v,0)+'</text>'}
    x.forEach(function(t,i){g+='<text x="'+px(i)+'" y="'+(H-12)+'" text-anchor="middle">'+esc(t)+'</text>'});
    if(c.meta!=null){var ym=py(c.meta);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ym+'" y2="'+ym+'" stroke="#b3261e" stroke-dasharray="5 4" stroke-width="1.5"/><text x="'+(W-R+8)+'" y="'+(ym+4)+'" style="fill:#b3261e;font-weight:600">Meta '+fmt(c.meta)+'</text>'}
    var finales=[];
    ss.forEach(function(s,si){var col=s.color||SERIE[si%SERIE.length],pts=[];s.valores.forEach(function(v,i){if(v!=null)pts.push([px(i),py(v),v])});
      if(ss.length===1&&pts.length>1)g+='<path d="M'+pts[0][0]+','+(T+ih)+' L'+pts.map(function(p){return p[0]+','+p[1]}).join(' L')+' L'+pts[pts.length-1][0]+','+(T+ih)+' Z" fill="'+col+'" opacity=".10"/>';
      g+='<polyline fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round" points="'+pts.map(function(p){return p[0]+','+p[1]}).join(' ')+'"/>';
      pts.forEach(function(p,j){g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#fff" stroke="'+col+'" stroke-width="2"/>';
        /* Con una serie, cada punto lleva su número; con varias, solo el último, para que no se pisen. */
        if(ss.length===1)g+='<text x="'+p[0]+'" y="'+(p[1]-10)+'" text-anchor="middle" style="fill:#12100c;font-weight:600">'+fmt(p[2])+'</text>';
        else if(j===pts.length-1)finales.push({x:p[0],y:p[1],v:p[2],col:col})});
    });
    finales.sort(function(a,b){return a.y-b.y});
    for(var q=1;q<finales.length;q++)if(finales[q].y-finales[q-1].y<15)finales[q].y=finales[q-1].y+15;
    finales.forEach(function(f){g+='<text x="'+(f.x+9)+'" y="'+(f.y+4)+'" style="fill:'+f.col+';font-weight:700">'+fmt(f.v)+'</text>'});
    var ley=ss.length>1?'<div class="leyenda">'+ss.map(function(s,si){return '<span style="--c:'+(s.color||SERIE[si%SERIE.length])+'">'+esc(s.nombre)+'</span>'}).join('')+'</div>':'';
    return '<div class="caja'+(c.ancho==='completo'?' ancho':'')+'">'+cab(c)+'<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(c.titulo)+'">'+g+'</svg>'+ley+pie(c)+'</div>';
  }

  function barras(c){
    var et=c.etiquetas||[],vs=c.valores||[],n=et.length,W=560,rowH=34,L=Math.min(200,12+Math.max.apply(null,et.map(function(t){return String(t).length}).concat([4]))*7),R=56,T=6,H=T+n*rowH+(c.meta!=null?18:4);
    var max=niceMax(Math.max.apply(null,vs.concat(c.meta!=null?[c.meta]:[]).concat([1])));var iw=W-L-R,g='',suf=c.sufijo||'';
    et.forEach(function(t,i){var y=T+i*rowH,w=Math.max(2,vs[i]/max*iw),col=(c.colores&&c.colores[i])||(c.meta!=null?(vs[i]>=c.meta?'#047732':'#ffc526'):SERIE[0]);
      g+='<text x="'+(L-8)+'" y="'+(y+rowH/2+4)+'" text-anchor="end" style="fill:#12100c">'+esc(t)+'</text><rect x="'+L+'" y="'+(y+6)+'" width="'+w+'" height="'+(rowH-12)+'" rx="3" fill="'+col+'"/><text x="'+(L+w+6)+'" y="'+(y+rowH/2+4)+'" style="fill:#12100c;font-weight:600">'+fmt(vs[i])+suf+'</text>'});
    if(c.meta!=null){var xm=L+c.meta/max*iw;g+='<line x1="'+xm+'" x2="'+xm+'" y1="'+T+'" y2="'+(T+n*rowH)+'" stroke="#b3261e" stroke-dasharray="5 4" stroke-width="1.5"/><text x="'+xm+'" y="'+(H-2)+'" text-anchor="middle" style="fill:#b3261e;font-weight:600">Meta '+fmt(c.meta)+suf+'</text>'}
    var ley=c.leyenda?'<div class="leyenda">'+c.leyenda.map(function(l){return '<span style="--c:'+l.color+'">'+esc(l.nombre)+'</span>'}).join('')+'</div>':'';
    return '<div class="caja'+(c.ancho==='completo'?' ancho':'')+'">'+cab(c)+'<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(c.titulo)+'">'+g+'</svg>'+ley+pie(c)+'</div>';
  }

  function dona(c){
    var ps=c.partes||[],tot=ps.reduce(function(a,p){return a+p.valor},0)||1,R=70,r=44,cx=90,cy=90,a0=-Math.PI/2,g='';
    ps.forEach(function(p,i){var a1=a0+p.valor/tot*2*Math.PI,col=p.color||SERIE[i%SERIE.length],big=a1-a0>Math.PI?1:0;
      if(p.valor/tot>=0.9999){g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(R+r)/2+'" fill="none" stroke="'+col+'" stroke-width="'+(R-r)+'"/>'}
      else g+='<path d="M'+(cx+R*Math.cos(a0))+','+(cy+R*Math.sin(a0))+' A'+R+','+R+' 0 '+big+' 1 '+(cx+R*Math.cos(a1))+','+(cy+R*Math.sin(a1))+' L'+(cx+r*Math.cos(a1))+','+(cy+r*Math.sin(a1))+' A'+r+','+r+' 0 '+big+' 0 '+(cx+r*Math.cos(a0))+','+(cy+r*Math.sin(a0))+' Z" fill="'+col+'"/>';a0=a1});
    var p0=ps[0]?Math.round(ps[0].valor/tot*100):0;
    g+='<text x="'+cx+'" y="'+(cy+9)+'" text-anchor="middle" style="fill:#12100c;font-size:26px;font-weight:700">'+p0+' %</text>';
    var ley='<div style="display:grid;gap:6px;align-content:center;font-size:13px">'+ps.map(function(p,i){return '<div><span style="display:inline-block;width:11px;height:11px;border-radius:2px;background:'+(p.color||SERIE[i%SERIE.length])+';margin-right:7px;vertical-align:-1px"></span>'+esc(p.nombre)+': <b>'+fmt(p.valor)+'</b> ('+Math.round(p.valor/tot*100)+' %)</div>'}).join('')+'</div>';
    return '<div class="caja'+(c.ancho==='completo'?' ancho':'')+'">'+cab(c)+'<div style="display:grid;grid-template-columns:180px 1fr;gap:14px;align-items:center;margin-top:8px"><svg viewBox="0 0 180 180" role="img" aria-label="'+esc(c.titulo)+'">'+g+'</svg>'+ley+'</div>'+pie(c)+'</div>';
  }

  function embudo(c){
    var ps=c.pasos||[],max=Math.max.apply(null,ps.map(function(p){return p.valor}).concat([1])),W=560,rh=46,H=ps.length*rh,g='';
    var cols=['#9aa0a6','#40b4e5','#1b7fb0','#047732'];
    ps.forEach(function(p,i){var w=Math.max(60,p.valor/max*(W-180)),x=(W-180-w)/2,col=p.color||cols[Math.max(0,cols.length-ps.length+i)]||SERIE[i];
      g+='<rect x="'+x+'" y="'+(i*rh+4)+'" width="'+w+'" height="'+(rh-8)+'" rx="4" fill="'+col+'"/><text x="'+(x+w/2)+'" y="'+(i*rh+rh/2+5)+'" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:14px">'+fmt(p.valor)+'</text>'
        +'<text x="'+(W-170)+'" y="'+(i*rh+rh/2-2)+'" style="fill:#12100c;font-weight:600">'+esc(p.nombre)+'</text><text x="'+(W-170)+'" y="'+(i*rh+rh/2+13)+'" style="font-size:11px">'+esc(p.fuente||'')+'</text>'});
    return '<div class="caja'+(c.ancho==='completo'?' ancho':'')+'">'+cab(c)+'<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(c.titulo)+'">'+g+'</svg>'+pie(c)+'</div>';
  }

  function tabla(c){
    var cols=c.columnas||[],num=cols.map(function(_,j){return (c.filas||[]).every(function(f){return f[j]===''||f[j]==null||!isNaN(Number(f[j]))})});
    return '<div class="caja'+(c.ancho==='mitad'?'':' ancho')+'">'+cab(c)+'<div class="tw"><table><thead><tr>'+cols.map(function(h,j){return '<th'+(num[j]?' style="text-align:right"':'')+'>'+esc(h)+'</th>'}).join('')+'</tr></thead><tbody>'
      +(c.filas||[]).map(function(f){return '<tr>'+f.map(function(v,j){return '<td'+(num[j]?' class="n"':'')+'>'+(num[j]&&v!==''&&v!=null?fmt(Number(v)):esc(v))+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'+pie(c)+'</div>';
  }

  var R = {linea:linea,barras:barras,dona:dona,embudo:embudo,tabla:tabla};
  document.title = 'Panel · '+(D.proyecto||'Campaña');
  document.getElementById('titulo').textContent = 'Panel de la campaña · '+(D.proyecto||'');
  document.getElementById('bajada').textContent = [D.institucion,D.periodo?'Periodo: '+D.periodo:'',D.actualizado?'Actualizado: '+D.actualizado:''].filter(Boolean).join(' · ');
  if(D.pdf){var bp=document.getElementById('btn-pdf');bp.href=D.pdf;bp.hidden=false}
  document.getElementById('btn-imp').onclick=function(){window.print()};

  var h='';
  if(D.ficticio)h+='<div class="ficticio">DATOS FICTICIOS · ejemplo para practicar, no son resultados de la campaña</div>';
  h+='<section class="resumen"><div class="caja"><h2>Conducta que buscamos</h2><p class="meta-grande">'+esc(D.conducta)+'</p>'+(D.audiencia?'<p class="sub" style="margin-top:6px">Audiencia: '+esc(D.audiencia)+'</p>':'')+'</div>'
    +'<div class="caja"><h2>Meta</h2><p class="meta-grande">'+esc(D.meta||'Falta definirla')+'</p>'+(D.partida!=null?'<p class="sub" style="margin-top:6px">Número de partida: '+esc(D.partida)+'</p>':'')+'</div></section>';
  var comps=D.componentes||[],k=comps.filter(function(c){return c.tipo==='kpi'}),o=comps.filter(function(c){return c.tipo!=='kpi'});
  if(k.length)h+='<section class="kpis">'+k.map(kpi).join('')+'</section>';
  if(o.length)h+='<section class="graficos">'+o.map(function(c){var f=R[c.tipo];return f?f(c):'<div class="caja">Tipo de componente desconocido: '+esc(c.tipo)+'</div>'}).join('')+'</section>';
  if(D.lecturas&&D.lecturas.length)h+='<section class="caja lecturas"><h2>Lo que dicen los datos</h2><ul>'+D.lecturas.map(function(l){return '<li>'+esc(l)+'</li>'}).join('')+'</ul></section>';
  h+='<footer><span>'+esc(D.equipo?'Preparado por '+D.equipo:'')+'</span><span>Marketing y Gestión de Causas Sociales · UCAB Guayana · Lee y Kotler (2020), cap. 15</span></footer>';
  app.innerHTML=h;
})();
</script>
</body>
</html>
